server.port=${PORT:5173}
spring.datasource.url=jdbc:sqlite:${NEXUS_DB:./nexus.sqlite}
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.maximum-pool-size=1
spring.jackson.serialization.write-dates-as-timestamps=true
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=35MB
nexus.jwt.secret=${JWT_SECRET:nexus-property-development-secret-change-me-2026-secure-key}
nexus.jwt.days=7
nexus.gemini.api-key=${GEMINI_API_KEY:}
nexus.frontend.dist=${FRONTEND_DIST:../dist}
